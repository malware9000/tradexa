version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradexa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradexa
      POSTGRES_PASSWORD: tradexa
      POSTGRES_DB: tradexa_dev
    ports:
      - "5432:5432"
    volumes:
      - tradexa_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradexa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  tradexa_pgdata:
