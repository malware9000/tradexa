services:
  - type: web
    name: tradexa-api
    runtime: node
    buildCommand: >-
      npm install &&
      DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy?sslmode=require" npm run generate --workspace packages/database &&
      npm run build --workspace packages/types &&
      npm run build --workspace packages/shared &&
      npm run build --workspace packages/validation &&
      npm run build --workspace packages/database &&
      npm run build --workspace services/api
    startCommand: npm run deploy --workspace packages/database && node services/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: REFRESH_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        sync: false
      - key: API_PREFIX
        value: "api/v1"
      - key: NODE_ENV
        value: production
